<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>SpamGuard AI</title>
<style>
:root{--bg:#0b1020;--card:#151b33;--tx:#e8ecff;--mu:#8a93b8;--ok:#2ecc8f;--bad:#ff5d6c;--ac:#6c7bff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:780px;margin:auto;padding:24px 16px}h1{margin:0 0 4px}.s{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px}
input,textarea{width:100%;background:#0e1329;color:var(--tx);border:1px solid #2a3260;border-radius:8px;padding:10px;font:inherit;margin-bottom:10px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;margin:0 6px 6px 0}
button.g{background:#232b55}button.on{background:var(--ac)}.v{font-size:2.2rem;font-weight:800}.HAM{color:var(--ok)}.SPAM{color:var(--bad)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;margin:3px;font-size:.85rem;background:#232b55}
.chip.f{background:#4a1f2a;color:#ffb3bb}.chip.r{background:#173d33;color:#9af0cb}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid #2a3260}
.hid{display:none}img{max-width:100%;border-radius:8px;background:#fff}
</style></head><body><main>
<h1>🛡️ SpamGuard AI</h1><p class="s">Check an SMS or an email: Spam or Ham (safe)?</p>
<div class="card">
<button id="bs" class="on" onclick="tab('sms')">📱 SMS</button><button id="be" class="g" onclick="tab('email')">📧 Email</button>
<div id="sub" class="hid"><input id="subject" placeholder="Email subject"></div>
<textarea id="m" rows="5" placeholder="Type or paste the message..."></textarea>
<button onclick="go()">Check</button>
<button class="g" onclick="spam()">Sample: Spam</button><button class="g" onclick="safe()">Sample: Safe</button></div>
<div id="res" class="card hid"><div class="v" id="v"></div><div id="c"></div>
<h4>Red flags</h4><div id="fl"></div><h4>Key words</h4><div id="kw"></div></div>
<div class="card"><h3>Model Analytics</h3><table id="t"></table><br><img src="/static/charts.png" alt="charts"></div>
</main><script>
const $=i=>document.getElementById(i); let mode='sms';
function tab(x){mode=x;$('sub').classList.toggle('hid',x==='sms');$('bs').className=x==='sms'?'on':'g';$('be').className=x==='email'?'on':'g';}
function spam(){ if(mode==='sms'){$('m').value='WINNER!! You have won a $1000 prize. Click http://claim-now.com to claim FREE cash. Call 09061701461 now!';}
 else{$('subject').value='URGENT: Your account will be suspended';$('m').value='Dear customer, your bank account is locked. Verify your password now at http://secure-bank-login.xyz or you will lose access. Claim your FREE $500 reward today!';} go();}
function safe(){ if(mode==='sms'){$('m').value='Hey, are we meeting at 6 pm near the bus stand? Bring the notes da.';}
 else{$('subject').value='Meeting notes for Monday';$('m').value='Hi team, please find the notes from todays meeting. Let me know if I missed anything. We will discuss the project plan on Monday at 10 am.';} go();}
async function go(){
 const msg=(mode==='email'?$('subject').value+' ':'')+$('m').value;
 const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
 const d=await r.json(); if(d.error) return alert(d.error);
 $('res').classList.remove('hid'); $('v').textContent=d.verdict==='SPAM'?'🚫 SPAM':'✅ HAM (Safe)'; $('v').className='v '+d.verdict;
 $('c').textContent=d.confidence+'% confidence';
 $('fl').innerHTML=d.flags.length?d.flags.map(f=>`<span class="chip f">${f}</span>`).join(''):'<span class="chip r">None</span>';
 $('kw').innerHTML=d.keywords.map(k=>`<span class="chip ${k.spam?'f':'r'}">${k.w}</span>`).join('');}
fetch('/metrics').then(r=>r.json()).then(m=>{
 let h='<tr><th>Model</th><th>Accuracy</th><th>Precision</th><th>Recall</th><th>F1</th></tr>';
 for(const[n,x]of Object.entries(m.results)) h+=`<tr><td>${n}${n===m.best?' ★':''}</td><td>${x.accuracy}%</td><td>${x.precision}%</td><td>${x.recall}%</td><td>${x.f1}%</td></tr>`;
 $('t').innerHTML=h;});
</script></body></html>
